name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: convee-publish
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  detect-version:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Detect publishable version
        id: version
        run: |
          VERSION=$(jq -r '.version' deno.json)
          TAG="v${VERSION}"

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Version tag already exists: $TAG"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: $TAG"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: [detect-version, quality]
    if: needs.detect-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "2.9.6"

      - name: Run linter
        run: deno lint

      - name: Run type check
        run: deno check src/index.ts

      - name: Run tests
        run: deno task test

      - name: Publish package
        run: deno publish

      - name: Create tag and release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          tag: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
